{% extends "base.html" %}
{% block title %}Add stock movement | Inventory Billing{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><h1 class="h3 mb-3">Add stock movement</h1>
<form method="post" class="card"><div class="card-body p-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save movement</button> <a class="btn btn-outline-secondary" href="{% url 'stock_movement_list' %}">Cancel</a></div></form>
</div></div>
{% endblock %}
