{% extends "base.html" %}
{% block title %}Delete category | Inventory Billing{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Delete category</h1>
                <p class="mb-4">Are you sure you want to delete <strong>{{ category.name }}</strong>? This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Delete category</button>
                    <a class="btn btn-outline-secondary" href="{% url 'category_list' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
