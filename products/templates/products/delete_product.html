{% extends "base.html" %}
{% block title %}Delete product | Inventory Billing{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card border-danger"><div class="card-body p-4">
        <h1 class="h4 text-danger">Delete product?</h1>
        <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This action cannot be undone.</p>
        <form method="post">{% csrf_token %}
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn btn-outline-secondary" href="{% url 'product_list' %}">Cancel</a>
        </form>
    </div></div>
</div></div>
{% endblock %}
